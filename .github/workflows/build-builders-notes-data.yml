name: Build Builder's Notes public image data

on:
  push:
    paths:
      - 'content/builders-notes/**'
      - 'tools/build-builders-notes-data.js'
      - '.github/workflows/build-builders-notes-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate public image data
        run: node tools/build-builders-notes-data.js

      - name: Commit generated data
        run: |
          if git diff --quiet -- assets/data/builders-notes.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/builders-notes.json
          git commit -m "Update Builder Notes public image data"
          git push
