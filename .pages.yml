media:
  input: media
  output: /media

content:

  # ============================================================
  # BUILDER'S NOTES
  # ============================================================

  - name: builders_notes
    label: Builder's Notes
    type: collection
    path: content/builders-notes
    format: yaml-frontmatter
    filename: "{ref}.md"

    view:
      primary: title
      fields: [ref, title, year, status]
      sort: [year, title]
      default:
        sort: year
        order: desc

    fields:

      - name: ref
        label: Código
        type: string
        required: true
        pattern: '^[A-Z]{2}-BN-[0-9]{3}$'

      - name: title
        label: Título
        type: string
        required: true

      - name: subtitle
        label: Subtítulo
        type: text

      - name: year
        label: Ano
        type: number

      - name: status
        label: Status
        type: select
        options:
          values:
            - draft
            - published

      - name: excerpt
        label: Resumo
        type: text

      - name: images
        label: Fotografias
        type: object
        fields:

          - name: hero
            label: Imagem de abertura
            type: object
            fields:

              - name: image
                label: Fotografia
                type: image
                options:
                  path: builders-notes

              - name: caption
                label: Legenda
                type: string

              - name: credit
                label: Crédito
                type: string

          - name: image_02
            label: Imagem 02
            type: object
            fields:

              - name: image
                label: Fotografia
                type: image
                options:
                  path: builders-notes

              - name: caption
                label: Legenda
                type: string

              - name: credit
                label: Crédito
                type: string

          - name: image_03
            label: Imagem 03
            type: object
            fields:

              - name: image
                label: Fotografia
                type: image
                options:
                  path: builders-notes

              - name: caption
                label: Legenda
                type: string

              - name: credit
                label: Crédito
                type: string

          - name: image_04
            label: Imagem 04
            type: object
            fields:

              - name: image
                label: Fotografia
                type: image
                options:
                  path: builders-notes

              - name: caption
                label: Legenda
                type: string

              - name: credit
                label: Crédito
                type: string

          - name: image_05
            label: Imagem 05
            type: object
            fields:

              - name: image
                label: Fotografia
                type: image
                options:
                  path: builders-notes

              - name: caption
                label: Legenda
                type: string

              - name: credit
                label: Crédito
                type: string

          - name: image_06
            label: Imagem 06
            type: object
            fields:

              - name: image
                label: Fotografia
                type: image
                options:
                  path: builders-notes

              - name: caption
                label: Legenda
                type: string

              - name: credit
                label: Crédito
                type: string

      - name: quote
        label: Frase de destaque
        type: text

      - name: archive_observation
        label: Observação do Archive
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: analysis
        label: Análise
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: builder_reflection
        label: Reflexão do Builder
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: principle
        label: Princípio
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: conclusion
        label: Conclusão
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: tags
        label: Tags
        type: string

      - name: credits
        label: Créditos
        type: text

      # Compatibilidade com os registros atuais
      - name: body
        label: Conteúdo editorial legado
        type: rich-text
        options:
          format: markdown
          switcher: true


  # ============================================================
  # WORKSHOP RECORDS
  # ============================================================

  - name: workshop_records
    label: Workshop Records
    type: collection
    path: content/workshop
    format: yaml-frontmatter
    filename: "{ref}.md"

    view:
      primary: title
      fields: [ref, title, year, status]
      sort: [year, title]
      default:
        sort: year
        order: desc

    fields:

      - name: ref
        label: Código
        type: string
        required: true
        pattern: '^[A-Z]{2}-WR-[0-9]{3}$'

      - name: title
        label: Título
        type: string
        required: true

      - name: subtitle
        label: Subtítulo
        type: text

      - name: year
        label: Ano
        type: number

      - name: status
        label: Status
        type: select
        options:
          values:
            - draft
            - published

      - name: excerpt
        label: Resumo
        type: text

      - name: hero
        label: Imagem de destaque
        type: image
        options:
          path: workshop

      - name: instruments
        label: Instrumentos
        type: object
        list:
          collapsible:
            summary: "{instrument} — {services}"
        fields:

          - name: instrument
            label: Instrumento
            type: string

          - name: brand
            label: Marca
            type: string

          - name: model
            label: Modelo
            type: string

          - name: services
            label: Serviços
            type: string

      - name: before_images
        label: Fotografias de entrada
        type: image
        options:
          path: workshop
          multiple:
            max: 20
          unique: true

      - name: workshop_images
        label: Fotografias da oficina
        type: image
        options:
          path: workshop
          multiple:
            max: 20
          unique: true

      - name: after_images
        label: Fotografias depois
        type: image
        options:
          path: workshop
          multiple:
            max: 20
          unique: true

      - name: quote
        label: Frase de destaque
        type: text

      - name: introduction
        label: Introdução
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: construction_note
        label: Observação de construção
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: before_text
        label: Estado de entrada
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: intervention
        label: Trabalho realizado
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: after_text
        label: Estado depois
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: conclusion
        label: Conclusão
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: tags
        label: Tags
        type: string

      - name: credits
        label: Créditos
        type: text

      # Compatibilidade com os registros atuais
      - name: body
        label: Conteúdo editorial legado
        type: rich-text
        options:
          format: markdown
          switcher: true


