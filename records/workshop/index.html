<!DOCTYPE html>

<link rel="stylesheet" href="../../assets/css/archive.css">
<style>
.workshop-photo{margin:30px 0 0;overflow:hidden;border:1px solid var(--line);background:rgba(13,7,3,.025)}
.workshop-photo img{display:block;width:100%;height:auto}.workshop-photo figcaption{padding:11px 14px;font:500 9px/1.4 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line)}
.workshop-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:30px}.workshop-gallery figure{margin:0;border:1px solid var(--line);background:rgba(13,7,3,.025)}.workshop-gallery img{display:block;width:100%;height:auto}.workshop-gallery figcaption{padding:10px 12px;font:500 8px/1.45 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line)}
.workshop-specs{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:30px}.workshop-spec{padding:18px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.workshop-spec strong{display:block;font:500 8px/1.3 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--sepia);margin-bottom:7px}.workshop-spec span{font:400 18px/1.25 'Cormorant Garamond',serif;color:var(--ink)}
.cms-photo-image{display:block;width:100%;height:auto}.cms-error{padding:30px 0;font:400 15px/1.7 Inter,sans-serif;color:var(--faint)}
@media(max-width:820px){.workshop-gallery{grid-template-columns:1fr}}@media(max-width:560px){.workshop-specs{grid-template-columns:1fr}}
</style>
</head>
